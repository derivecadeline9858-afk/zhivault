name: release

# 推送 v* tag 触发：audit 门禁 → 测试 → tauri build → portable zip + SHA-256 → Release
on:
  push:
    tags:
      - 'v*'

env:
  PNPM_VERSION: '11'
  # GitHub 海外 runner 访问 npmmirror 不稳定（首次发布安装依赖失败根因）：
  # CI 内覆盖为官方 registry；lockfile 未锁定 tarball URL，切换零成本。
  # 审计步骤另行显式 --registry npmjs（npmmirror 无 audit 端点）。
  npm_config_registry: 'https://registry.npmjs.org'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # softprops/action-gh-release 创建 Release 需写权限（默认只读会 403）
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 供应链审计门禁（高危漏洞阻塞发布，PRD §8-6）
        # npmmirror 未实现 audit 端点，审计显式走官方 registry（构建期网络无关产物）
        run: pnpm audit --registry https://registry.npmjs.org --audit-level=high

      - name: 质量门
        run: |
          pnpm tsc
          pnpm eslint
          pnpm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Tauri 构建
        run: pnpm tauri build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: 打包 portable zip
        shell: pwsh
        run: |
          $zip = "zhivault-${{ github.ref_name }}-x64.zip"
          Compress-Archive -Path "src-tauri/target/release/zhivault.exe" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$zip.sha256" -Value "$hash  $zip"
          $size = (Get-Item $zip).Length
          # CI 产物 <30MB 门禁（PRD §10 验收）
          if ($size -ge 30MB) { throw "产物 $([math]::Round($size/1MB,2))MB 超过 30MB 上限" }
          echo "ARTIFACT=$zip" >> $env:GITHUB_ENV
          echo "SIZE_MB=$([math]::Round($size/1MB,2))" >> $env:GITHUB_ENV

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: zhivault-portable
          path: |
            zhivault-${{ github.ref_name }}-x64.zip
            zhivault-${{ github.ref_name }}-x64.zip.sha256

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zhivault-${{ github.ref_name }}-x64.zip
            zhivault-${{ github.ref_name }}-x64.zip.sha256
          body: |
            知藏 ZhiVault ${{ github.ref_name }}（作者：橙茶星）

            portable zip + SHA-256 校验见下方附件。
            SmartScreen 提示参见 README。
