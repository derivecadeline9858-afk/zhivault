[package]
name = "zhivault"
version = "0.1.0"
description = "知藏 ZhiVault —— 把知乎装进自己口袋（作者：橙茶星）"
authors = ["橙茶星"]
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
url = "2"
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }
